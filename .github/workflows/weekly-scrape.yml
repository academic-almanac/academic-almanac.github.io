name: Weekly scrape

# Scrapes weekly and opens a pull request. Merging the PR publishes; closing it
# rejects. Nothing goes live unreviewed, and nothing needs a local command.
#
#   scrape -> branch scrape/<date> -> publish.py rebuilds data.json
#          -> commit -> PR, review requested from the maintainer
#
# The PR diff shows exactly what will appear on the site. To drop an entry,
# edit its line in the candidates file to add  "skip": true  (GitHub's web
# editor works fine on a phone) - pr-sync.yml then rebuilds data.json on the
# branch so the diff stays honest.

on:
  schedule:
    - cron: "0 6 * * 1"        # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Listing pages to read (6 calls each)"
        required: false
        default: "8"
      min_days:
        description: "Skip calls closing sooner than this many days"
        required: false
        default: "7"

permissions:
  contents: write              # commit the branch
  pull-requests: write         # open the PR

concurrency:
  group: weekly-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30        # a 15s crawl delay per page adds up

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4 lxml openpyxl

      - name: Scrape
        id: scrape
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages || '8' }}
          MIN_DAYS: ${{ github.event.inputs.min_days || '7' }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%F)"
          OUT="candidates/emerald-$DATE.jsonl"

          # candidates/seen.txt is the durable memory - every link ever emitted,
          # rejections included - and the scraper reads and appends to it.
          # data.json is a belt-and-braces check against what is published.
          python scripts/scrape_emerald.py \
            --max-pages "$MAX_PAGES" \
            --min-days "$MIN_DAYS" \
            --allow-empty \
            --known data.json \
            --out "$OUT"

          if [ -f "$OUT" ]; then
            echo "new=true"                     >> "$GITHUB_OUTPUT"
            echo "count=$(grep -cv '^//' "$OUT")" >> "$GITHUB_OUTPUT"
            echo "file=$OUT"                    >> "$GITHUB_OUTPUT"
            echo "branch=scrape/$DATE"          >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new this week - no pull request needed."
          fi

      - name: Rebuild data.json
        if: steps.scrape.outputs.new == 'true'
        run: python scripts/publish.py

      - name: Open a pull request
        if: steps.scrape.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.scrape.outputs.branch }}
          FILE: ${{ steps.scrape.outputs.file }}
          COUNT: ${{ steps.scrape.outputs.count }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A second run on the same day reuses the branch rather than failing.
          git checkout -B "$BRANCH"
          git add candidates data data.json
          git commit -m "Weekly scrape: $COUNT new call(s)"
          git push --force-with-lease origin "$BRANCH"

          python scripts/issue_body.py "$FILE" > body.md
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "Weekly scrape: $COUNT new call(s)" \
                                 --body-file body.md
            echo "Updated the existing pull request."
          else
            gh pr create \
              --base main --head "$BRANCH" \
              --title "Weekly scrape: $COUNT new call(s)" \
              --body-file body.md \
              --reviewer "${{ github.repository_owner == 'academic-almanac' && 'dejanzafirev' || github.actor }}" \
              --assignee dejanzafirev
          fi
